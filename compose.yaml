services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    volumes:
      - ./client:/usr/src/app:rw       # bind mount your source for live edits
      - client_node_modules:/usr/src/app/node_modules  # named volume preserves image-built node_modules
    # optional: depend on server if needed
    # depends_on:
    #   - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app:rw

volumes:
  client_node_modules:
